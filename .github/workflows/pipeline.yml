name: GameSignal Daily Pipeline
on:
  schedule:
    # 매일 KST 06:00 = UTC 21:00 (전날)
    - cron: '0 21 * * *'
  workflow_dispatch:
    # 수동 실행 버튼 (테스트용)
    inputs:
      reason:
        description: '실행 이유'
        required: false
        default: '수동 테스트'
      steps:
        # 예: reviews → 리뷰만 실행, 신호 엔진 건너뜀 (낮 시간 실행 시 가짜 신규 진입 신호 방지)
        #     reviews,signal_engine → 신호 엔진은 명시했을 때만 실행
        description: '실행 단계 (all 또는 쉼표 구분: most_played, wishlist, reviews, appdetails, signal_engine)'
        required: false
        default: 'all'
        type: string
jobs:
  run-pipeline:
    # ubuntu-latest 이미지 전환에 따른 예기치 않은 변경 방지 — 버전 고정
    runs-on: ubuntu-24.04
    # 단계별 상한 합계 72분(pipeline/run.js) + 설치 여유. 이 값에 걸리면 cancelled 처리됨
    timeout-minutes: 90
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v6
      - name: Node.js 22 설정
        uses: actions/setup-node@v6
        with:
          # Node 20은 2026-04 EOL → 22 (LTS)
          node-version: '22'
          cache: 'npm'
      - name: Python 설정 (Playwright용)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: npm ci
      - name: Supabase IPv4 주소 등록 (IPv6 우회)
        run: |
          SUPABASE_HOST="db.bgsutabumisgjsyeeodb.supabase.co"
          SUPABASE_IPV4=$(curl -s "https://dns.google/resolve?name=${SUPABASE_HOST}&type=A" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['Answer'][0]['data'])" 2>/dev/null || echo "")
          if [ -n "$SUPABASE_IPV4" ]; then
            echo "$SUPABASE_IPV4 $SUPABASE_HOST" | sudo tee -a /etc/hosts
            echo "✅ IPv4 등록: $SUPABASE_IPV4"
          else
            echo "⚠️ IPv4 조회 실패 - 기본 연결 시도"
          fi
      - name: 파이프라인 실행
        env:
          DATABASE_URL:              ${{ secrets.DATABASE_URL }}
          REDIS_URL:                 ${{ secrets.REDIS_URL }}
          STEAM_API_KEY:             ${{ secrets.STEAM_API_KEY }}
          YOUTUBE_API_KEYS:          ${{ secrets.YOUTUBE_API_KEYS }}
          DISCORD_WEBHOOK_ALERT:     ${{ secrets.DISCORD_WEBHOOK_ALERT }}
          DISCORD_WEBHOOK_PIPELINE:  ${{ secrets.DISCORD_WEBHOOK_PIPELINE }}
          # 단계별 상한 (pipeline/run.js) — 리뷰·appdetails는 수집기 내부 상한 15분
          STEP_TIMEOUT_MOST_PLAYED_MS:   '900000'
          STEP_TIMEOUT_WISHLIST_MS:      '480000'
          STEP_TIMEOUT_REVIEWS_MS:       '1020000'
          STEP_TIMEOUT_APPDETAILS_MS:    '1020000'
          STEP_TIMEOUT_SIGNAL_ENGINE_MS: '900000'
          REVIEWS_BUDGET_MS:             '900000'
          REVIEWS_INTERVAL_MS:           '1600'
          APPDETAILS_BUDGET_MS:          '900000'
          RETRY_MAX:                 '3'
          RETRY_BASE_MS:             '1000'
          SCRAPE_DELAY_MIN_MS:       '3000'
          SCRAPE_DELAY_MAX_MS:       '5000'
          BLOCK_WAIT_MS:             '900000'
          NODE_ENV:                  production
          # schedule 실행은 항상 all — 수동 실행(workflow_dispatch)일 때만 입력값 사용
          PIPELINE_STEPS: ${{ github.event_name == 'workflow_dispatch' && inputs.steps || 'all' }}
        run: node pipeline/run.js
      - name: 실패·취소 시 Discord 알림
        # cancelled(timeout 포함)는 failure()에 잡히지 않아 그동안 알림이 누락됐음
        if: failure() || cancelled()
        env:
          DISCORD_WEBHOOK_ALERT: ${{ secrets.DISCORD_WEBHOOK_ALERT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          curl -sS -H "Content-Type: application/json" \
          -d "{\"embeds\":[{\"title\":\"🚨 GitHub Actions 파이프라인 ${JOB_STATUS}\",\"description\":\"즉시 확인이 필요합니다.\\n${RUN_URL}\",\"color\":14889515}]}" \
          "$DISCORD_WEBHOOK_ALERT"
